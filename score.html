<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제1회 제주시농협 AI 공모전 · 실시간 채점</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f3f5f2;--card:#fff;--ink:#15201a;--muted:#66726a;--line:#dde3dd;
  --pri:#0b7a43;--pri-soft:#e3f2e9;--warn:#c2410c;--warn-soft:#fff0e6;
  --gold:#b88a00;--danger:#b42318;--dark:#0f2a1c;--r:14px
}
*{box-sizing:border-box}
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--pri)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 20px;background:var(--dark);color:#fff;flex-wrap:wrap}
.brand{font-weight:900;font-size:18px}.sub{font-size:13px;opacity:.75}
.who{font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.wrap{max-width:1200px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
.narrow{max-width:760px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h2{margin:0 0 12px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;cursor:pointer;background:var(--pri);color:#fff;white-space:nowrap}
.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
.btn.soft{background:var(--pri-soft);color:var(--pri)}
.btn.warn{background:var(--warn)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.big{padding:14px 20px;font-size:17px;width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.muted{color:var(--muted);font-size:13px}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#eef1ee;color:#46524a;white-space:nowrap}
.badge.r1{background:#fff4d1;color:#8a6400}
.badge.on{background:var(--pri);color:#fff}
.badge.off{background:#f1e4e2;color:var(--danger)}
.notice{padding:12px 14px;border-radius:10px;background:var(--pri-soft);font-size:14px}
.notice.warn{background:var(--warn-soft);color:#7a2e08}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.cur{background:#f0f9f3}
.mv{display:flex;gap:3px;margin-top:4px}
.mv button{border:1px solid var(--line);background:#fff;border-radius:6px;font-size:11px;padding:2px 6px;cursor:pointer;line-height:1.3}
.mv button:hover{border-color:var(--pri);color:var(--pri)}
.moved{display:block;font-size:11px;color:#1d4ed8;font-weight:700;white-space:nowrap}
.pin{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;background:#e0ecff;color:#1d4ed8}
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.addrow input{flex:1 1 200px;width:auto;min-width:0}
.nm-in{padding:5px 8px!important;max-width:140px}
.badge.no{background:#fde8e6;color:#b42318}
details.bulk{margin-top:12px}details.bulk summary{cursor:pointer;font-size:13px;font-weight:700;color:var(--pri)}
.tbl{overflow-x:auto}
label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 4px}
input[type=text],input[type=number],input[type=email],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#fff}
textarea{min-height:90px;resize:vertical}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#15201a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.toast.err{background:var(--danger)}
.center{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login{max-width:420px;text-align:center}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.menu a{display:block;padding:20px;border-radius:var(--r);background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink)}
.menu a b{display:block;font-size:17px;margin-bottom:4px}
/* live */
.now{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.now .nm{font-size:24px;font-weight:900;line-height:1.3}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{padding:5px 10px;border-radius:999px;font-size:13px;border:1px solid var(--line);background:#fff;cursor:pointer}
.chip.ok{background:var(--pri-soft);border-color:#b7dcc6;color:var(--pri);font-weight:700}
.chip.sel{outline:2px solid var(--pri)}
.chip.cur{border-color:var(--warn)}
.bigstat{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums}
/* judge */
.crit-row{display:grid;grid-template-columns:1fr 1.2fr 90px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
@media(max-width:560px){.crit-row{grid-template-columns:1fr 90px}.crit-row input[type=range]{grid-column:1/-1;grid-row:2}}
.crit-row label{font-weight:700}
.crit-row input[type=range]{width:100%;accent-color:var(--pri)}
.total{font-size:20px;text-align:right;margin:14px 0}
.total b{font-size:30px}
.total.over b{color:var(--danger)}
/* vote */
.vote{max-width:520px;margin:0 auto;padding:22px 16px 40px}
.vote h1{font-size:20px;margin:0 0 4px}
.vcard{background:#fff;border-radius:18px;padding:20px;border:1px solid var(--line);margin-top:16px}
.vcard .nm{font-size:24px;font-weight:900;margin:6px 0}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}
.scale button{padding:16px 0;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:20px;font-weight:900;cursor:pointer}
.scale button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.scale-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
/* board */
body.boardmode{background:#0b1a12;color:#f2f7f3}
.board{padding:24px 28px;min-height:100vh}
.b-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:22px}
.b-title{font-size:30px;font-weight:900}
.b-now{font-size:18px;opacity:.9}
.b-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:1000px){.b-cols{grid-template-columns:1fr}}
.b-col{background:#12271b;border-radius:18px;padding:18px}
.b-col h3{margin:0 0 12px;font-size:20px;color:#9fe0b8}
.b-item{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid #1f3a2a}
.b-rank{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;background:#1f3a2a}
.b-rank.g1{background:#e3b505;color:#231900}.b-rank.g2{background:#c3ccd2;color:#1a1f22}.b-rank.g3{background:#c97f3e;color:#25130a}
.b-nm{font-weight:700;font-size:17px}.b-tt{font-size:13px;opacity:.65}
.b-sc{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;text-align:right}
.b-sc small{display:block;font-size:11px;font-weight:500;opacity:.6}
.b-item.cur{background:#183424;border-radius:10px}
#b-qr{position:fixed;right:24px;bottom:24px;background:#fff;padding:14px;border-radius:16px;color:#111;text-align:center;font-weight:700;display:none}
#b-qr.show{display:block}
</style>
</head>
<body>
<div id="app"><div class="center muted">불러오는 중…</div></div>

<script type="module">
import { firebaseConfig, SUPER_ADMINS, CATEGORIES } from './config.js';
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signInAnonymously, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, where, orderBy, serverTimestamp, writeBatch, getDocs, arrayUnion, arrayRemove } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

/* ---------------- 기본값 ---------------- */
const DEFAULT_PUB = {
  title: '제1회 제주시농협 AI 공모전',
  judgeWeight: 80,        // 심사위원 반영 비율(%)
  audienceWeight: 20,     // 관람객 반영 비율(%)
  incentiveRate: 3,       // 1차 접수 인센티브(총점의 %)
  voteScale: 10,          // 관람객 투표 척도 (1~N점)
  criteria: {
    idea: [ {name:'창의성·독창성',max:30},{name:'실현 가능성',max:25},{name:'업무·조합 기여도',max:25},{name:'발표 전달력',max:20} ],
    gen:  [ {name:'창의성·독창성',max:30},{name:'작품 완성도',max:30},{name:'AI 활용 수준',max:20},{name:'메시지 전달력',max:20} ],
    prog: [ {name:'기능 완성도',max:30},{name:'활용도·효과성',max:30},{name:'기술적 난이도',max:20},{name:'사용 편의성',max:20} ]
  }
};

/* ---------------- 유틸 ---------------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = x => Math.round((x + Number.EPSILON) * 100) / 100;          // 소수 셋째 자리에서 반올림
const f2 = x => (x == null || isNaN(x)) ? '-' : r2(x).toFixed(2);
const catName = id => CATEGORIES.find(c => c.id === id)?.name || id;
const fmtTime = ts => { const d = ts?.toDate?.(); return d ? d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}) : '-'; };
const lc = s => String(s||'').trim().toLowerCase();
function toast(msg, type=''){ document.querySelectorAll('.toast').forEach(x => x.remove()); const t=document.createElement('div'); t.className='toast '+type; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }

const view = new URLSearchParams(location.search).get('view') || 'home';
const appEl = $('#app');

if (!firebaseConfig.apiKey) {
  appEl.innerHTML = `<div class="center"><div class="card login"><h2>Firebase 설정이 필요합니다</h2><p class="muted">config.js 에 Firebase 웹 앱 설정값을 입력한 뒤 다시 열어 주세요. (README.md 참고)</p></div></div>`;
  throw new Error('firebaseConfig empty');
}

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

/* ---------------- 상태 ---------------- */
const S = { user:null, pub:null, pubExists:true, access:{adminEmails:[],judgeEmails:[],judges:[]}, live:{}, liveExists:true, teams:[], scores:[], votes:[], my:{} };
const P = () => ({ ...DEFAULT_PUB, ...(S.pub||{}), criteria: { ...DEFAULT_PUB.criteria, ...((S.pub||{}).criteria||{}) } });
const critOf = cat => P().criteria[cat] || [];
const teamById = id => S.teams.find(t => t.id === id);
const isClosed = id => (S.live.closedTeams || []).includes(id);
const isAdminEmail = () => { const e = lc(S.user?.email); return SUPER_ADMINS.map(lc).includes(e) || (S.access.adminEmails||[]).map(lc).includes(e); };
const isJudgeEmail = () => (S.access.judgeEmails||[]).map(lc).includes(lc(S.user?.email));
const judges = () => S.access.judges || [];
const myJudgeName = () => judges().find(j => lc(j.email) === lc(S.user?.email))?.name || S.user?.displayName || S.user?.email;
let refresh = () => {};

/* ---------------- 점수 계산 ---------------- */
// 최종 = (심사위원 평균(100점) × 심사비율 + 관람객 평균(100점 환산) × 관람객비율) × (1 + 1차 인센티브)
function computeResults(){
  const p = P(); const wj = p.judgeWeight/100, wa = p.audienceWeight/100, inc = p.incentiveRate/100, vs = p.voteScale;
  const rows = S.teams.map(t => {
    const js = S.scores.filter(s => s.teamId === t.id);
    const vv = S.votes.filter(v => v.teamId === t.id);
    const judgeAvg = js.length ? js.reduce((a,s)=>a+Number(s.total||0),0)/js.length : null;
    const audAvg   = vv.length ? vv.reduce((a,v)=>a+Number(v.score||0),0)/vv.length * (100/vs) : null;
    const judgePart = (judgeAvg ?? 0) * wj;
    const audPart   = (audAvg ?? 0) * wa;
    const base  = judgePart + audPart;
    const bonus = Number(t.round) === 1 ? base * inc : 0;
    return { ...t, judgeCount: js.length, voteCount: vv.length, judgeAvg, audAvg, judgePart, audPart, base, bonus, final: r2(base + bonus), scored: js.length > 0, rank: null };
  });
  for (const c of CATEGORIES) {
    const list = rows.filter(r => r.category === c.id && r.scored)
      .sort((a,b) => (b.final - a.final) || (r2(b.judgeAvg) - r2(a.judgeAvg)));
    list.forEach((r,i) => {
      const prev = list[i-1];
      r.rank = (prev && prev.final === r.final && r2(prev.judgeAvg) === r2(r.judgeAvg)) ? prev.rank : i + 1;
    });
  }
  return rows;
}

/* ---------------- 공통 구독 ---------------- */
function subCommon(){
  onSnapshot(doc(db,'config','public'), s => { S.pub = s.exists() ? s.data() : null; S.pubExists = s.exists(); refresh(); });
  onSnapshot(doc(db,'state','live'),   s => { S.live = s.exists() ? s.data() : {}; S.liveExists = s.exists(); refresh(); });
  onSnapshot(query(collection(db,'teams'), orderBy('seq')), s => { S.teams = s.docs.map(d => ({ id:d.id, ...d.data() })); refresh(); });
}
function subAdminData(){
  onSnapshot(doc(db,'config','access'), s => { S.access = s.exists() ? s.data() : {adminEmails:[],judgeEmails:[],judges:[]}; refresh(); });
  onSnapshot(collection(db,'scores'), s => { S.scores = s.docs.map(d => ({ id:d.id, ...d.data() })); refresh(); });
  onSnapshot(collection(db,'votes'),  s => { S.votes  = s.docs.map(d => ({ id:d.id, ...d.data() })); refresh(); });
}
const updateLive = patch => setDoc(doc(db,'state','live'), { ...patch, updatedAt: serverTimestamp() }, { merge:true });

function header(sub){
  return `<header class="top"><div><div class="brand">${esc(P().title)}</div><div class="sub">${esc(sub)}</div></div>
  <div class="who">${S.user && !S.user.isAnonymous ? `${esc(S.user.email)} <button class="btn ghost sm" data-act="logout">로그아웃</button>` : ''}</div></header>`;
}
function renderLogin(msg=''){
  appEl.innerHTML = `<div class="center"><div class="card login">
    <h2 style="justify-content:center">${view==='judge'?'심사위원 로그인':'운영자 로그인'}</h2>
    <p class="muted">등록된 구글 계정으로 로그인해 주세요.</p>
    ${msg?`<div class="notice warn" style="margin:12px 0">${esc(msg)}</div>`:''}
    <button class="btn big" data-act="login">Google 계정으로 로그인</button></div></div>`;
}
function renderDenied(msg){
  appEl.innerHTML = `<div class="center"><div class="card login"><h2 style="justify-content:center">접근 권한 없음</h2>
  <p>${esc(msg)}</p><p class="muted">${esc(S.user?.email||'')}</p>
  <button class="btn ghost" data-act="logout">다른 계정으로 로그인</button></div></div>`;
}
function renderHome(){
  appEl.innerHTML = `<div class="wrap narrow"><h1 style="margin:10px 0 4px">제1회 제주시농협 AI 공모전</h1><p class="muted">사용할 화면을 선택하세요.</p>
  <div class="menu">
    <a href="?view=admin"><b>🛠 운영 관리</b><span class="muted">발표 진행, 투표 열기/닫기, 결과 확인</span></a>
    <a href="?view=judge"><b>📝 심사위원 채점</b><span class="muted">구글 로그인 후 항목별 채점</span></a>
    <a href="?view=vote"><b>📱 관람객 투표</b><span class="muted">QR로 접속하는 현장 투표</span></a>
    <a href="?view=board"><b>🏆 실시간 순위 전광판</b><span class="muted">대형 화면용 (운영자 로그인)</span></a>
    <a href="order.html"><b>🎲 발표 순서 추첨</b><span class="muted">부문별 발표 순서 결정</span></a>
    <a href="?view=users"><b>👥 계정 관리</b><span class="muted">운영 관리자·심사위원 추가와 로그인 확인</span></a>
  </div></div>`;
}

/* ================================================================
   운영 관리
================================================================ */
let settingsDirty = false;
function startAdmin(){
  appEl.innerHTML = header('운영 관리') + `<main class="wrap">
    <div id="a-setup"></div>
    <section class="card" id="a-live"></section>
    <div class="grid2"><section class="card" id="a-qr"></section><section class="card" id="a-links"></section></div>
    <section class="card" id="a-teams"></section>
    <section class="card" id="a-results"></section>
    <section class="card" id="a-settings"></section>
    <section class="card" id="a-danger"></section>
  </main>`;
  subCommon(); subAdminData();
  renderQR(); renderLinks(); renderDanger();
  refresh = () => { renderSetup(); renderLive(); renderTeams(); renderResults(); if (!settingsDirty) renderSettings(); };
  refresh();
}
const voteURL = () => location.origin + location.pathname + '?view=vote';

function renderSetup(){
  const el = $('#a-setup'); if (!el) return;
  if (!S.pubExists || !S.liveExists) {
    el.innerHTML = `<div class="notice warn row" style="justify-content:space-between">처음 사용하시나요? 기본 설정을 생성해야 시스템이 동작합니다.
      <button class="btn sm" data-act="initSetup">기본 설정 생성</button></div>`;
  } else if (!S.teams.length) {
    el.innerHTML = `<div class="notice">등록된 참가팀이 없습니다. <a href="order.html">발표 순서 추첨</a>에서 명단을 입력하고 ‘심사 시스템에 반영’을 누르세요.</div>`;
  } else el.innerHTML = '';
}

function renderLive(){
  const el = $('#a-live'); if (!el) return;
  const t = teamById(S.live.currentTeamId);
  const js = judges();
  const vCount = t ? S.votes.filter(v => v.teamId === t.id).length : 0;
  const closed = t && isClosed(t.id);
  el.innerHTML = `<h2>🎤 현재 진행</h2>
  <div class="now">
    <div style="flex:1;min-width:260px">
      ${t ? `<div class="row"><span class="badge">${t.seq}번 · ${esc(catName(t.category))}</span>${Number(t.round)===1?'<span class="badge r1">1차 접수</span>':''}${closed?'<span class="badge off">채점 마감</span>':''}</div>
        <div class="nm" style="margin-top:6px">${esc(t.name)}</div><div class="muted">${esc(t.title)}</div>
        <div class="chips">${js.length ? js.map(j => { const ok = S.scores.some(s => s.teamId===t.id && lc(s.email)===lc(j.email)); return `<span class="chip ${ok?'ok':''}">${ok?'✓':'…'} ${esc(j.name)}</span>`; }).join('') : '<span class="muted">설정에서 심사위원을 등록하세요</span>'}</div>`
      : `<div class="muted">발표 중인 팀이 없습니다. 아래 목록에서 ‘발표 시작’을 누르세요.</div>`}
    </div>
    <div style="text-align:right">
      <div class="muted">관람객 투표</div>
      <div class="bigstat">${vCount}<span style="font-size:15px"> 표</span></div>

function exportCSV(){
  const p = P(); const res = computeResults(); const js = judges();
  const head = ['부문','순위','발표순서','추첨순서','팀명','작품명','접수차수', ...js.map(j => `심사:${j.name}`), '심사평균', `심사환산(${p.judgeWeight}%)`, '관람객투표수', '관람객평균(100점환산)', `관람객환산(${p.audienceWeight}%)`, '합계', `1차인센티브(${p.incentiveRate}%)`, '최종점수'];
  const lines = [head];
  for (const c of CATEGORIES) {
    res.filter(r => r.category === c.id).sort((a,b) => (a.rank??999)-(b.rank??999) || a.seq-b.seq).forEach(r => {
      lines.push([c.name, r.rank??'', r.seq, r.origSeq ?? r.seq, r.name, r.title, Number(r.round)===1?'1차':'2차',
        ...js.map(j => { const s = S.scores.find(x => x.teamId===r.id && lc(x.email)===lc(j.email)); return s ? f2(s.total) : ''; }),
        f2(r.judgeAvg), r.scored?f2(r.judgePart):'', r.voteCount, f2(r.audAvg), r.scored?f2(r.audPart):'', r.scored?f2(r.base):'', r.scored?f2(r.bonus):'', r.scored?f2(r.final):'']);
    });
  }
  const csv = '\uFEFF' + lines.map(l => l.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = `${P().title}_결과_${new Date().toISOString().slice(0,16).replace(/[:T]/g,'')}.csv`; a.click();
}

function parseCrit(txt){
  return txt.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const i = l.lastIndexOf(','); return { name: l.slice(0,i).trim(), max: Number(l.slice(i+1)) }; });
}

async function saveAccess(patch){

async function addJudges(list){
  const map = new Map(judges().map(j => [lc(j.email), { ...j }])); let added = 0, updated = 0;
  for (const j of list) { const e = lc(j.email); if (map.has(e)) { if (j.name) { map.get(e).name = j.name; updated++; } } else { map.set(e, { email: e, name: j.name || e.split('@')[0] }); added++; } }
  if (await saveAccess({ judges: [...map.values()] })) toast(`심사위원 ${added}명 추가` + (updated ? `, ${updated}명 이름 갱신` : ''));
}

    if (i < 0 || j < 0 || j >= ids.length) return toast(Number(d.dir) < 0 ? '이미 첫 순서입니다' : '이미 마지막 순서입니다');

      await setDoc(doc(db,'votes',`${t.id}_${S.user.uid}`), { teamId: t.id, uid: S.user.uid, score: V.pick, at: serverTimestamp() });
      V.mine = V.pick; toast('투표 완료! 감사합니다'); renderVote();
    } catch(e) { toast('투표가 마감되었거나 오류가 발생했습니다', 'err'); }
  }
};
async function applyOrder(ids){
  const b = writeBatch(db); let n = 0;
  ids.forEach((id, k) => { const t = teamById(id); const seq = k + 1;
    if (t.seq !== seq) { b.set(doc(db,'teams',id), { seq, origSeq: t.origSeq ?? t.seq }, { merge:true }); n++; } });
  if (n) await b.commit();
}
function moveTeam(dir){
  if (!S.teams.length) return;
  const i = S.teams.findIndex(t => t.id === S.live.currentTeamId);
  const n = i < 0 ? (dir > 0 ? 0 : S.teams.length - 1) : i + dir;
  if (n < 0 || n >= S.teams.length) return toast(dir > 0 ? '마지막 팀입니다' : '첫 팀입니다');
  updateLive({ currentTeamId: S.teams[n].id, voteOpen: false });
}
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; const f = ACT[b.dataset.act]; if (f) f(b.dataset, b); });

/* ================================================================
   시작
================================================================ */
if (view === 'home') renderHome();
onAuthStateChanged(auth, async user => {
  S.user = user;
  if (view === 'home') return;
  if (view === 'vote') { if (!user) { try { await signInAnonymously(auth); } catch(e){ appEl.innerHTML = '<div class="center">접속 오류: 익명 로그인이 비활성화되어 있습니다.</div>'; } return; } startVote(); return; }
  if (!user || user.isAnonymous) return renderLogin();
  try { const a = await getDoc(doc(db,'config','access')); if (a.exists()) S.access = a.data(); } catch(e) {}
  // 로그인 기록: 권한이 없어도 남겨서, 운영자가 계정 관리 화면에서 정확한 이메일을 확인하고 바로 등록할 수 있게 함
  setDoc(doc(db,'logins',lc(user.email)), { email: lc(user.email), name: user.displayName || '', view, lastSeen: serverTimestamp() }, { merge:true }).catch(() => {});
  if (view === 'judge') { if (!isJudgeEmail()) return renderDenied('심사위원으로 등록된 계정이 아닙니다. 운영자에게 문의하세요.'); startJudge(); }
  else if (view === 'admin' || view === 'board' || view === 'users') { if (!isAdminEmail()) return renderDenied('관리자 계정이 아닙니다.'); view === 'admin' ? startAdmin() : view === 'board' ? startBoard() : startUsers(); }
  else renderHome();
});
</script>
